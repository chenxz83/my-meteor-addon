name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build 1.21.11
        run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: my-meteor-addon

      - name: Build 1.21.8
        run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: my-meteor-addon-1.21.8

      - name: Upload 1.21.11 jar
        uses: actions/upload-artifact@v4
        with:
          name: my-meteor-addon-1.21.11
          path: my-meteor-addon/build/libs/my-meteor-addon-*.jar

      - name: Upload 1.21.8 jar
        uses: actions/upload-artifact@v4
        with:
          name: my-meteor-addon-1.21.8
          path: my-meteor-addon-1.21.8/build/libs/my-meteor-addon-*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: jars

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
